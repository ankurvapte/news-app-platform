# Runs the whole news app. Each service still builds from its own repo,
# which must be cloned next to this one (../articles-svc, ../users-svc).
# Once images are published to a registry, swap `build:` for a pinned `image:` tag.
name: news-app

services:
  articles-svc:
    build: ../articles-svc
    image: articles-svc:local
    ports:
      - "8090:8080"
    environment:
      LOG_LEVEL: INFO
      DEFAULT_PAGE_SIZE: "5"
      MAX_PAGE_SIZE: "50"
    restart: unless-stopped

  users-svc:
    build: ../users-svc
    image: users-svc:local
    ports:
      - "8081:8080"
    environment:
      LOG_LEVEL: INFO
      DEFAULT_PAGE_SIZE: "10"
      MAX_PAGE_SIZE: "50"
      # Dev-only default password; set USERS_DB_PASSWORD in your shell or .env for anything else.
      DATABASE_URL: postgresql://users:${USERS_DB_PASSWORD:-users-dev-password}@users-db:5432/users
      SEED_FILE: /app/data/users.json
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped

  # Database per service: only users-svc talks to it, and no host port is published.
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users-dev-password}
      POSTGRES_DB: users
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  users-db-data:
